<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OKV School Sign-in</title>
<style>
:root { --ink:#1b2430; --muted:#5b6675; --line:#d9dee6; --brand:#2456b8; --bad:#b42318; --bg:#f5f7fa; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ink:#e8edf4; --muted:#9aa6b6; --line:#2e3744; --brand:#7aa2ff; --bad:#ff8a80; --bg:#12161c; } }
:root[data-theme="dark"] { --ink:#e8edf4; --muted:#9aa6b6; --line:#2e3744; --brand:#7aa2ff; --bad:#ff8a80; --bg:#12161c; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
main { max-width:360px; margin:12vh auto; padding:0 16px; }
h1 { font-size:22px; margin:0 0 6px; }
p.sub { color:var(--muted); margin:0 0 20px; font-size:14px; }
label { display:block; font-size:13px; color:var(--muted); margin:12px 0 4px; }
input { width:100%; box-sizing:border-box; padding:10px; font-size:16px; border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--ink); }
button { width:100%; margin-top:18px; padding:12px; font-size:16px; border:0; border-radius:8px; background:var(--brand); color:#fff; cursor:pointer; }
.msg { min-height:20px; margin-top:12px; font-size:14px; color:var(--muted); }
.msg.bad { color:var(--bad); }
</style>
</head>
<body>
<main>
  <h1>OKV Teaching Studio</h1>
  <p class="sub">Sign in with the email and password your teacher gave you.</p>
  <form id="f">
    <label for="em">Email</label>
    <input id="em" type="email" autocomplete="username" required>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
  <div id="msg" class="msg"></div>
  <p class="sub" style="margin-top:24px">First time here? <a href="install.html">Install the app</a> first.</p>
</main>
<script src="common.js"></script>
<script>
const existing = Session.user();
if (existing) location.replace(Session.home(existing.role));
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg'); const btn = e.target.querySelector('button');
  btn.disabled = true; Ui.msg(msg, 'Signing in…');
  try {
    const r = await Api.call('login', { email: document.getElementById('em').value, password: document.getElementById('pw').value });
    Session.set({ token: r.token, user: r.user });
    location.href = Session.home(r.user.role);
  } catch (err) { Ui.msg(msg, err.message, true); btn.disabled = false; }
});
</script>
</body>
</html>
